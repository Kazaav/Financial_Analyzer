<!DOCTYPE html>
<html lang="{{ lang or 'ja' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ t('register.title', '新規登録') }} · Financial Analyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
  (function(){
    try{ if(localStorage.getItem('fa-theme')==='light') document.documentElement.setAttribute('data-theme','light'); }catch(e){}
    document.addEventListener('click',function(e){
      var b=e.target.closest&&e.target.closest('[data-theme-toggle]'); if(!b)return;
      var d=document.documentElement, light=d.getAttribute('data-theme')==='light';
      if(light){d.removeAttribute('data-theme');} else {d.setAttribute('data-theme','light');}
      try{ localStorage.setItem('fa-theme', light?'dark':'light'); }catch(e){}
      document.dispatchEvent(new CustomEvent('fa-themechange'));
    });
  })();
  </script>
  <link rel="stylesheet" href="/static/styles.css?v=20260614d">
</head>
<body>
<div class="auth-hero">

  <header class="auth-topbar">
    <a class="auth-brand" href="/"><span class="landing-brand-dot"></span><span>Financial Analyzer</span></a>
    <div class="auth-topbar-right">
      <div class="lang-switch" role="group" aria-label="Language">
        <a class="lang-opt {% if lang == 'ja' %}is-active{% endif %}" href="/set-lang/ja?next=/register">JA</a>
        <a class="lang-opt {% if lang == 'en' %}is-active{% endif %}" href="/set-lang/en?next=/register">EN</a>
        <a class="lang-opt {% if lang == 'zh' %}is-active{% endif %}" href="/set-lang/zh?next=/register">中</a>
      </div>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="テーマ切替" title="ライト / ダーク切替">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v1.5M12 20.5V22M3.5 12H2M22 12h-1.5M5.6 5.6 4.5 4.5M19.5 19.5l-1.1-1.1M18.4 5.6l1.1-1.1M4.5 19.5l1.1-1.1"/></svg>
      </button>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-center">
      <h1 class="auth-headline">{{ t('register.title', '新規登録') }}</h1>
      <p class="auth-sub">{{ t('register.subtitle', '招待コードでアカウントを作成') }}</p>

      <div class="auth-card">
        {% if error %}
        <div class="notice warn" role="alert" style="margin-bottom:14px">{{ error }}</div>
        {% endif %}
        <form class="auth-form" action="/register" method="post">
          <div class="field">
            <label for="code">{{ t('register.invite_code', '招待コード') }}</label>
            <input type="text" id="code" name="code" value="{{ code or '' }}" required autofocus
                   autocomplete="off" autocapitalize="off" spellcheck="false">
          </div>
          <div class="field">
            <label for="username">{{ t('register.username', 'ユーザー名') }}</label>
            <input type="text" id="username" name="username" value="{{ username or '' }}"
                   autocomplete="username" autocapitalize="off" spellcheck="false" required>
          </div>
          <div class="field">
            <label for="display_name">{{ t('register.display_name', '表示名（任意）') }}</label>
            <input type="text" id="display_name" name="display_name" value="{{ display_name or '' }}">
          </div>
          <div class="field">
            <label for="email">{{ t('register.email', 'メール（任意）') }}</label>
            <input type="email" id="email" name="email" value="{{ email or '' }}" autocomplete="email">
          </div>
          <div class="field">
            <label for="password">{{ t('register.password', 'パスワード') }}</label>
            <input type="password" id="password" name="password" autocomplete="new-password" required>
          </div>
          <div class="field">
            <label for="confirm">{{ t('register.confirm', 'パスワード（確認）') }}</label>
            <input type="password" id="confirm" name="confirm" autocomplete="new-password" required>
          </div>
          <button class="button primary" type="submit">{{ t('register.submit', '登録') }}</button>
        </form>
        <div class="auth-foot">
          <a href="/login">{{ t('register.has_account', 'すでにアカウントをお持ちですか？ ログイン') }}</a>
          <a class="muted-link" href="/">{{ t('login.back', '← トップに戻る') }}</a>
        </div>
      </div>
    </div>
  </main>

</div>
</body>
</html>
