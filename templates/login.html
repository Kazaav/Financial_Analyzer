<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン · Financial Analyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
  (function(){ try{ if(localStorage.getItem('fa-theme')==='light') document.documentElement.setAttribute('data-theme','light'); }catch(e){} })();
  </script>
  <link rel="stylesheet" href="/static/styles.css?v=20260614a">
</head>
<body>

<div class="login-shell">
  <div class="login-panel">

    <div class="login-brand-block">
      <svg class="login-logo-svg" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="36" height="36">
        <defs>
          <linearGradient id="logoG" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="var(--accent)"/>
            <stop offset="100%" stop-color="var(--accent-strong)"/>
          </linearGradient>
        </defs>
        <rect width="36" height="36" rx="9" fill="url(#logoG)"/>
        <rect x="8" y="11" width="12" height="2" rx="1" fill="white"/>
        <rect x="8" y="16" width="20" height="2" rx="1" fill="white"/>
        <rect x="8" y="21" width="16" height="2" rx="1" fill="white"/>
      </svg>
      <div>
        <p class="eyebrow">Financial Analyzer</p>
        <h1 class="brand">ログイン</h1>
      </div>
    </div>

    {% if error %}
    <div class="notice warn login-error" role="alert">{{ error }}</div>
    {% endif %}

    <form class="login-form" action="/login" method="post">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field">
        <label for="username">ユーザー名</label>
        <input type="text" id="username" name="username"
               autocomplete="username" autocapitalize="off" spellcheck="false"
               required autofocus>
      </div>
      <div class="field">
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password"
               autocomplete="current-password" required>
      </div>
      <button class="button primary login-button" type="submit">ログイン</button>
    </form>

    <div style="margin-top:20px;text-align:center;display:grid;gap:8px">
      <a href="/register" style="font-size:13px;color:var(--accent)">{{ t('register.title', '新規登録') }}</a>
      <a href="/" style="font-size:12px;color:var(--t3)">← トップに戻る</a>
    </div>

  </div>
</div>

</body>
</html>
